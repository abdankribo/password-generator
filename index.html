<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><p class="eyebrow">SECURITY TOOL</p><h1>Password Generator</h1><p class="muted">Buat password acak sesuai kebutuhan.</p><div class="output"><input id="password" readonly><button id="copy">Copy</button></div><div class="length"><label>Panjang <b id="len">16</b></label><input id="range" type="range" min="6" max="40" value="16"></div><div class="checks"><label><input id="upper" type="checkbox" checked> Huruf besar</label><label><input id="lower" type="checkbox" checked> Huruf kecil</label><label><input id="numbers" type="checkbox" checked> Angka</label><label><input id="symbols" type="checkbox" checked> Simbol</label></div><button id="generate" class="generate">Generate Password</button><div id="strength" class="strength"></div></main><script src="script.js"></script></body></html>
